name: Build and Test JabberPoint

on:
  pull_request:
    branches: [ develop, production ]
  push:
    branches: [ develop, production ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The unit tests construct Swing/AWT components (JFrame, Frame, ...), which
      # cannot be created in headless mode. Xvfb gives the CI runner a virtual
      # display so those tests can run.
      - name: Install Xvfb for the GUI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit tests
        run: xvfb-run -a mvn -B verify

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          echo "## Test Summary" >> "$GITHUB_STEP_SUMMARY"
          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            TOTAL=$(grep -hE "^Tests run:" target/surefire-reports/*.txt | grep -vc "Skipped" || true)
            echo "- Surefire reports generated in \`target/surefire-reports/\`" >> "$GITHUB_STEP_SUMMARY"
            grep -hE "^Tests run:" target/surefire-reports/*.txt | tail -n 1 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "- No surefire reports were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
