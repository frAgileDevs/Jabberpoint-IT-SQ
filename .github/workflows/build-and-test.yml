name: Build and Test JabberPoint

on:
  pull_request:
    branches: [ develop, production ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Compile Java source files
      run: |
        mkdir -p bin
        find src -name "*.java" > sources.txt
        javac -d bin @sources.txt
        
    - name: Verify compilation
      run: |
        CLASS_COUNT=$(find bin -name "*.class" | wc -l)
        if [ "$CLASS_COUNT" -gt 0 ]; then
        echo "Compilation successful! $CLASS_COUNT class files created"
        else
        echo "Compilation failed!"
        exit 1
        fi

        
    - name: Test with demo presentation
      run: |
        echo "Testing application launch with demo mode..."
        if [ -f bin/com/nhlstenden/jabberpoint/JabberPoint.class ]; then
          MAIN_CLASS=com.nhlstenden.jabberpoint.JabberPoint
        else
          MAIN_CLASS=JabberPoint
        fi
        timeout 5s java -cp bin "$MAIN_CLASS" || true
        echo "Application can be launched"
        
    - name: Test with XML file
      run: |
        echo "Testing application launch with test.xml..."
        if [ -f test.xml ]; then
          if [ -f bin/com/nhlstenden/jabberpoint/JabberPoint.class ]; then
            MAIN_CLASS=com.nhlstenden.jabberpoint.JabberPoint
          else
            MAIN_CLASS=JabberPoint
          fi
          timeout 5s java -cp bin "$MAIN_CLASS" test.xml || true
          echo "XML loading test completed"
        else
          echo "test.xml not found, skipping XML test"
        fi
        
    - name: Build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Java files compiled: " >> $GITHUB_STEP_SUMMARY
        echo "- Class files generated: $(find bin -name \"*.class\" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- Application launch: " >> $GITHUB_STEP_SUMMARY
